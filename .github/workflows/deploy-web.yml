name: Deploy web, dashboard và mobile lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: DinhDocLapGuide   # thư mục chứa package.json gốc của dự án

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DinhDocLapGuide/package-lock.json
      - run: npm ci
      - run: npm test

      - name: Build web
        run: npm --workspace apps/web run build
        env:
          VITE_BASE: /${{ env.REPO }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MOBILE_URL: ${{ env.SITE }}/m/
          VITE_DASHBOARD_URL: ${{ env.SITE }}/admin/

      - name: Build dashboard
        run: npm --workspace apps/dashboard run build
        env:
          VITE_BASE: /${{ env.REPO }}/admin/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WEBSITE_URL: ${{ env.SITE }}/

      - name: Build mobile (bản web của app Expo)
        run: npm --workspace apps/mobile run export:web
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_BASE_URL: /${{ env.REPO }}/m
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Gộp web (gốc), dashboard (/admin) và mobile (/m)
        run: |
          mkdir -p site/admin site/m
          cp -r apps/web/dist/. site/
          cp -r apps/dashboard/dist/. site/admin/
          cp -r apps/mobile/dist/. site/m/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: DinhDocLapGuide/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
