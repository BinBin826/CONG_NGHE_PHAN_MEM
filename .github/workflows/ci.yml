name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: DinhDocLapGuide

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DinhDocLapGuide/package-lock.json

      # Dùng npm install (không dùng npm ci) vì lockfile tạo trên Windows
      # có thể thiếu các gói native cho Linux (esbuild, rollup).
      - name: Install dependencies
        run: npm install

      - name: Test web
        run: npm test

      - name: Build web
        run: npm run web:build

      - name: Export mobile (kiểm tra bundle)
        run: npm run mobile:export

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: DinhDocLapGuide/apps/web/dist
