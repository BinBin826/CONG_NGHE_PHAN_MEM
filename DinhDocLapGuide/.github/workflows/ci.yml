name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cài dependencies
        run: npm install
      - name: Unit test (shared + web)
        run: npm test
      - name: Build Web
        run: npm run web:build
      - name: Export Mobile (kiểm tra bundle)
        run: npm run mobile:export
      - name: Lưu bản build Web
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist